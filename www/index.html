<script>
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function b64(u8){let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)}
async function nativeSave(filename,u8){
  const FS=Capacitor.Plugins.Filesystem,SH=Capacitor.Plugins.Share;
  const name=filename.replace(/[\\/:*?"<>|]/g,'_');
  const r=await FS.writeFile({path:name,data:b64(u8),directory:'CACHE'});
  await SH.share({title:name,url:r.uri,dialogTitle:'حفظ أو مشاركة الملف'});
}
</script>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PERMS={upload:'رفع وتوزيع الملفات',users:'إنشاء المستخدمين والصلاحيات',report:'سحب التقرير',options:'إدارة الخيارات',review:'مراجعة الحالات المغلقة والرد وتحويلها للمناطق'};
const KEY='wf_app_v1';
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(db&&!db.fields)db.fields=[];
if(!db)db={fields:[],users:[{u:'admin',p:'admin123',name:'المدير',role:'manager',perms:Object.keys(PERMS)}],headers:[],rows:[],opts:['تم الإنجاز','قيد المتابعة','لم يرد','مرفوض','يحتاج مراجعة']};
let SRV='',sv=0,pfail=0,applying=false,pushT=null,online=false;
try{SRV=localStorage.getItem('wf_srv')||(!NATIVE&&location.protocol.startsWith('http')?location.origin+'/api':'')}catch(e){}
function applyDB(o){Object.keys(db).forEach(k=>{delete db[k]});Object.assign(db,o);
  db.users=db.users||[];db.reports=db.reports||[];db.regions=db.regions||[];db.companies=db.companies||[];db.viols=db.viols||[];}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function dbStamp(){const e=document.getElementById('syn');if(e)e.textContent=online?('متصل بقاعدة البيانات · نسخة '+sv):'حفظ محلي على هذا الجهاز فقط'}
async function pull(force){
  if(!SRV)return false;
  try{const r=await fetch(SRV+'/db',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();
    online=true;pfail=0;
    if(force||j.v!==sv){sv=j.v;if(j.data&&j.data.users){applying=true;applyDB(j.data);localSave();applying=false;if(me)render()}}
    dbStamp();return true}
  catch(e){online=false;pfail++;
    if(pfail>=2){let set='';try{set=localStorage.getItem('wf_srv')||''}catch(x){}if(!set)SRV=''}
    dbStamp();return false}
}
async function push(){
  if(!SRV||applying)return;
  try{const r=await fetch(SRV+'/db',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:sv,data:db})});
    if(!r.ok)throw 0;const j=await r.json();sv=j.v;online=true;dbStamp()}
  catch(e){online=false;dbStamp()}
}
const save=()=>{localSave();if(SRV&&!applying){clearTimeout(pushT);pushT=setTimeout(push,700)}};
let repId=null;if(!db.regions)db.regions=[];if(!db.companies)db.companies=[];if(!db.viols)db.viols=[];
if(!db.reports)db.reports=(db.rows&&db.rows.length)?[{id:'r1',name:'التقرير الأول',headers:db.headers,rows:db.rows,emps:[...new Set(db.rows.map(r=>r.a))],date:''}]:[];
const DEF=['تم الإنجاز','قيد المتابعة','لم يرد','مرفوض','يحتاج مراجعة'];
db.reports.forEach(r=>{if(!r.opts)r.opts=[...(db.opts||DEF)];if(!r.fields)r.fields=JSON.parse(JSON.stringify(db.fields||[]))});
delete db.headers;delete db.rows;delete db.opts;delete db.fields;
const curRep=()=>db.reports.find(x=>x.id===repId)||null;
Object.defineProperty(db,'rows',{enumerable:false,configurable:true,get(){const r=curRep();return r?r.rows:[]},set(v){const r=curRep();if(r)r.rows=v}});
Object.defineProperty(db,'opts',{enumerable:false,configurable:true,get(){const r=curRep();return r?r.opts:[]}});
Object.defineProperty(db,'fields',{enumerable:false,configurable:true,get(){const r=curRep();return r?r.fields:[]},set(v){const r=curRep();if(r)r.fields=v}});
Object.defineProperty(db,'headers',{enumerable:false,configurable:true,get(){const r=curRep();return r?r.headers:[]}});
const allRows=()=>db.reports.flatMap(r=>r.rows);
const vis=()=>db.reports.filter(r=>isM()||r.emps.includes(me.u));
const mineAll=()=>isM()?allRows():allRows().filter(r=>r.a===me.u);
const repEmps=()=>emps().filter(e=>(curRep()||{emps:[]}).emps.includes(e.u));
function repPills(){
  const v=vis();if(!v.length)return '';
  return `<div class="pn"><div class="bd"><div class="rp">`+v.map(r=>`<button class="rc ${r.id===repId?'on':''}" data-r="${r.id}"><b>${esc(r.name)}</b><span>${isM()?`${r.rows.length} حالة · ${r.emps.length} موظف`:`${r.rows.filter(x=>x.a===me.u).length} حالة لك`}</span></button>`).join('')+`</div></div></div>`;
}
function wirePills(){document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{repId=b.dataset.r;T.a.p=T.b.p=T.c.p=1;filt='';render()})}
let me=null,sec='dash',unlocked=false,filt='',msg='';
const isM=()=>me.role==='manager';
const can=p=>isM()||me.perms.includes(p);
const emps=()=>db.users.filter(u=>u.role==='employee');

function ask(title,body,okTxt,cb){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="pn"><div class="hd">${title}</div><div class="bd">${body}<div class="row" style="margin-top:14px"><button id="mo">${okTxt}</button><button class="g" id="mx">إلغاء</button></div></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mx').onclick=()=>shut(m);
  m.querySelector('#mo').onclick=()=>{if(cb(m)!==false)shut(m)};
  return m;
}
function login(){
  $('#root').innerHTML=`<div class="login"><div class="pn"><div class="hd">تسجيل الدخول</div><div class="bd"><span class="logo">Pioneers</span><div class="mu">دخول موحد للموظف والمدير</div>
  <label>اسم المستخدم</label><input id="lu" autocomplete="username"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password">
  <p id="le" style="color:var(--rd);min-height:20px;margin:8px 0"></p><button style="width:100%" id="lb">دخول</button>
  <p class="mu" style="margin-bottom:0">أول استخدام: admin / admin123</p></div></div></div>`;
  const go=()=>{const u=db.users.find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value);
    if(!u){$('#le').textContent='بيانات الدخول غير صحيحة';return}
    me=u;sec='dash';unlocked=false;filt='';render()};
  $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
function nav(s){
  if(false){
    ask('تأكيد سريع','<label>أدخل كلمة المرور للدخول إلى هذا القسم</label><input id="qp" type="password">','تأكيد',m=>{
      if(m.querySelector('#qp').value!==me.p){alert('كلمة المرور غير صحيحة');return false}
      unlocked=true;sec=s;msg='';render()}).querySelector('#qp').focus();
    return;
  }
  sec=s;msg='';render();
}
function shut(m,cb){
  if(!m||m.dataset.out)return;m.dataset.out='1';m.classList.add('out');
  setTimeout(()=>{m.remove();if(cb)cb()},320);
}
function toast(t,bad){
  let e=document.getElementById('tst');
  if(!e){e=document.createElement('div');e.id='tst';document.body.appendChild(e)}
  e.textContent=(bad?'⚠ ':'✓ ')+(t||'تم الحفظ');e.className='';void e.offsetWidth;
  e.className='show'+(bad?' bad':'');
  clearTimeout(toast._t);toast._t=setTimeout(()=>{e.className=''},2200);
}
function P(t,b){return `<div class="pn"><div class="hd">${t}</div><div class="bd">${b}</div></div>`}
function render(){
  if(!me)return login();
  if(sec!=='redit'&&sec!=='fedit'&&sec!=='vedit'&&sec!=='viols'&&!vis().some(r=>r.id===repId))repId=vis()[0]?vis()[0].id:null;
  const seeCases=isM()||can('review')||allRows().some(r=>r.a===me.u);
  const tabs=[['dash','الرئيسية']];
  if(seeCases)tabs.push(['data',isM()?'الحالات':'حالاتي']);
  if(!seeCases&&(sec==='data'||sec==='edit'))sec=myViols().length?'viols':'dash';
  if(can('upload'))tabs.push(['upload','رفع وتوزيع ملف']);
  if(can('options'))tabs.push(['options','الخيارات']);if(can('users'))tabs.push(['users','المستخدمون والصلاحيات'],['regions','المناطق'],['companies','الشركات']);
  if(myViols().length||isM())tabs.splice(2,0,['viols','المخالفات ('+myViols().filter(v=>vTurn(v)).length+')']);
  if(isM()||can('review')||db.regions.some(g=>g.emps.includes(me.u)))tabs.splice(2,0,['rcases','حالات المناطق']);
  if(isM()||db.reports.some(x=>x.by===me.u))tabs.splice(2,0,['final','اعتماد الإغلاق']);
  if(can('report'))tabs.push(['prod','الإنتاجية'],['report','التقرير']);
  if(isM()||can('users'))tabs.push(['dbsec','قاعدة البيانات']);
  $('#root').innerHTML=`<div class="top"><span class="logo">Pioneers</span>${tabs.map(t=>`<a class="${sec===t[0]||(sec==='edit'&&t[0]==='data')||(sec==='redit'&&t[0]==='rcases')||(sec==='fedit'&&t[0]==='final')||(sec==='vedit'&&t[0].indexOf('viols')===0)?'on':''}" data-s="${t[0]}">${t[1]}</a>`).join('')}<span class="sp"></span><span class="usr">${esc(me.name)} · ${isM()?'مدير':'موظف'}</span><button class="g" id="out">خروج</button></div><main id="mn"></main>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>nav(b.dataset.s));
  $('#out').onclick=()=>{me=null;render()};
  ({dash,data:dataV,edit,review:null,upload,options,users,report,regions,companies,rcases,redit,final,fedit,viols,vedit,prod,dbsec})[sec]();
}
const mine=()=>isM()?db.rows:db.rows.filter(r=>r.a===me.u);
const done=r=>!!r.s;
const nm=u=>(db.users.find(x=>x.u===u)||{name:'—'}).name;
function donut(d,t){
  const p=t?Math.round(d/t*100):0;
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 36 36" width="150" height="150"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="4"/><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--ok)" stroke-width="4" stroke-dasharray="${p} ${100-p}" transform="rotate(-90 18 18)"/><text x="18" y="20.5" text-anchor="middle" font-size="7" font-weight="700" fill="var(--tx)">${p}%</text></svg><div><div><span class="tag ok">&nbsp;</span> مغلقة: <b>${d}</b></div><div style="margin-top:6px"><span class="tag">&nbsp;</span> معلقة: <b>${t-d}</b></div></div></div>`;
}
function days7(rs){
  const ds=[...Array(7)].map((_,k)=>new Date(Date.now()-(6-k)*864e5).toISOString().slice(0,10));
  const v=ds.map(d=>rs.filter(r=>r.d===d).length),mx=Math.max(1,...v);
  return `<svg viewBox="0 0 350 150" width="100%">`+v.map((n,i)=>{const h=n/mx*95,x=14+i*48;return `<rect x="${x}" y="${118-h}" width="30" height="${h}" rx="4" fill="var(--pr)"/><text x="${x+15}" y="${112-h}" text-anchor="middle" font-size="11" fill="var(--tx)">${n}</text><text x="${x+15}" y="136" text-anchor="middle" font-size="10" fill="var(--mu)">${ds[i].slice(5)}</text>`}).join('')+`</svg>`;
}
function hbars(items){
  const mx=Math.max(1,...items.map(i=>i[1]));
  return items.map(i=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${esc(i[0])}</span><b>${i[1]}</b></div><div class="bar"><i style="width:${i[1]/mx*100}%;background:var(--pr)"></i></div></div>`).join('')||'<p class="mu">لا توجد بيانات</p>';
}
function hero(rs,d,p,today){
  const hr=new Date().getHours(),g=hr<12?'صباح الخير':'مساء الخير',td=rs.filter(r=>r.d===today).length;
  return `<div class="hero"><div><small>${g}</small><h1>${esc(me.name)}</h1><p>${rs.length-d?`لديك ${rs.length-d} حالة معلقة بانتظار المتابعة`:'لا توجد حالات معلقة، عمل رائع'}${td?` · أغلقت اليوم ${td}`:''}</p></div><svg viewBox="0 0 36 36" width="150" height="150"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="#ffffff30" stroke-width="3.2"/><circle class="ring" style="--p:${p}" cx="18" cy="18" r="15.9155" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" transform="rotate(-90 18 18)"/><text x="18" y="20.5" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">${p}%</text></svg></div>`;
}
function cu(){document.querySelectorAll('[data-cu]').forEach(e=>{const t=parseInt(e.dataset.cu),sf=String(e.dataset.cu).includes('%')?'%':'',t0=performance.now();const f=n=>{const k=Math.min(1,(n-t0)/800);e.textContent=Math.round(t*(1-Math.pow(1-k,3)))+sf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function dash(){
  if(!(isM()||can('review')||allRows().some(r=>r.a===me.u)))return vdash();
  const rs=mineAll(),d=rs.filter(done).length,p=rs.length?Math.round(d/rs.length*100):0,today=new Date().toISOString().slice(0,10);
  let h=hero(rs,d,p,today)+`<div class="grid st-g" style="margin-bottom:18px">`+[['إجمالي الحالات',rs.length],['الحالات المغلقة',d],['الحالات المعلقة',rs.length-d],['أُغلقت اليوم',rs.filter(r=>r.d===today).length],['نسبة الإنجاز',p+'%']].map(x=>`<div class="st pn" style="padding:14px"><span class="mu">${x[0]}</span><b data-cu="${x[1]}">${x[1]}</b></div>`).join('')+`</div>`;
  const rc={};rs.filter(done).forEach(r=>rc[r.s]=(rc[r.s]||0)+1);
  const reasons=Object.entries(rc).sort((a,b)=>b[1]-a[1]);
  if(isM()){
    const st=emps().map(e=>{const r=allRows().filter(x=>x.a===e.u),k=r.filter(done).length;return {n:e.name,t:r.length,k,q:r.length?Math.round(k/r.length*100):0,td:r.filter(x=>x.d===today).length}});
    const mx=Math.max(1,...st.map(x=>x.t));
    h+=P('إنتاجية الموظفين (مغلقة / معلقة)',st.map(x=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${esc(x.n)}</span><span class="mu">أُغلق ${x.k} من ${x.t} (${x.q}%) · اليوم ${x.td}</span></div><div class="bar" style="height:14px;width:${x.t/mx*100}%;min-width:40px;display:flex"><i style="width:${x.q}%;background:var(--ok)"></i></div></div>`).join('')||'<p class="mu">لا يوجد موظفون بعد</p>');
    h+=`<div class="two">${P('نسبة الإنجاز الكلية',donut(d,rs.length))}${P('أعلى الموظفين إغلاقاً',hbars(st.slice().sort((a,b)=>b.k-a.k).map(x=>[x.n,x.k])))}</div>`;
  }else h+=P('تقدمي',donut(d,rs.length));
  h+=`<div class="two">${P('الإغلاق خلال آخر 7 أيام',days7(rs))}${P('توزيع الأسباب',hbars(reasons))}</div>`;
  $('#mn').innerHTML=h;cu();
}
let vmode='cards';try{vmode=localStorage.getItem('wf_view')||'cards'}catch(e){}
const T={a:{q:'',n:10,p:1},b:{q:'',n:10,p:1},c:{q:'',n:10,p:1}};
const hdrs=()=>[...db.headers,...(isM()?['الموظف']:[]),...db.fields.map(f=>f.name),'الحالة','ملاحظات'];
const cells=r=>[...db.headers.map((_,j)=>r.c[j]??''),...(isM()?[nm(r.a)]:[]),...db.fields.map(f=>(r.x||{})[f.id]||''),r.s,r.n];
const view=id=>{const rs=isM()&&filt?db.rows.filter(r=>r.a===filt):mine();return rs.filter(r=>!r.vio).filter(r=>id==='a'?(!r.s&&!(r.reg&&!r.rd)):id==='c'?(!r.s&&r.reg&&!r.rd):!!r.s)};
const flt=id=>{const q=T[id].q.toLowerCase();return view(id).filter(r=>!q||cells(r).join(' ').toLowerCase().includes(q))};
function shell(id,title){
  return `<div class="pn"><div class="hd">${title}</div><div class="bd"><div class="tool"><input data-q="${id}" placeholder="بحث" value="${esc(T[id].q)}"><span class="sp"></span><label style="margin:0">عدد الصفوف</label><select data-n="${id}">${[10,25,50,100].map(x=>`<option ${T[id].n===x?'selected':''}>${x}</option>`).join('')}</select><button class="g" data-c="${id}">Copy</button><button class="g" data-x="${id}">Export Excel</button><span class="sp"></span><button class="${vmode==='cards'?'':'g'}" data-vm="cards">▦ كروت</button><button class="${vmode==='table'?'':'g'}" data-vm="table">▤ جدول</button></div><div class="tw" id="tb${id}"></div><div class="pg" id="pg${id}"></div></div></div>`;
}
function upd(id){
  const t=T[id],rs=flt(id),pages=Math.max(1,Math.ceil(rs.length/t.n));t.p=Math.min(t.p,pages);

const PRP='FF47008A',PNK='FFEC205A',ROW='FFF7F3FB',BDR='FFE6E0F3';
async function book(sheets){
  if(typeof ExcelJS==='undefined'){
    const wb=XLSX.utils.book_new();
    sheets.forEach(sh=>{const ws=XLSX.utils.aoa_to_sheet(sh.aoa);ws['!cols']=(sh.aoa[0]||[]).map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,30))});
    return new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  }
  const wb=new ExcelJS.Workbook();wb.creator='Pioneers';wb.created=new Date();
  const thin={style:'thin',color:{argb:BDR}};
  sheets.forEach(sh=>{
    const ws=wb.addWorksheet(sh.name.slice(0,30),{views:[{rightToLeft:true,state:'frozen',ySplit:sh.title?2:1}],properties:{defaultRowHeight:18}});
    const cols=(sh.aoa[0]||[]).length;
    if(sh.title){const t=ws.addRow([sh.title]);ws.mergeCells(1,1,1,Math.max(cols,1));
      t.height=28;const c=t.getCell(1);c.font={bold:true,size:14,color:{argb:'FFFFFFFF'}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PNK}};c.alignment={horizontal:'center',vertical:'middle'}}
    sh.aoa.forEach(r=>ws.addRow(r));
    const hIdx=sh.title?2:1,hr=ws.getRow(hIdx);hr.height=24;
    hr.eachCell({includeEmpty:true},c=>{c.font={bold:true,color:{argb:'FFFFFFFF'},size:11};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PRP}};
      c.alignment={horizontal:'center',vertical:'middle',wrapText:true};
      c.border={top:thin,left:thin,right:thin,bottom:thin}});
    const last=ws.rowCount;
    for(let i=hIdx+1;i<=last;i++){const r=ws.getRow(i),tot=sh.total&&i===last;
      r.eachCell({includeEmpty:true},c=>{
        c.alignment={horizontal:'right',vertical:'middle',wrapText:false};
        c.border={top:thin,left:thin,right:thin,bottom:thin};
        if(tot)c.font={bold:true,color:{argb:PRP}};
        const f=tot?'FFEDE4F7':((i-hIdx)%2===0?ROW:null);
        if(f)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:f}}})}
    for(let j=1;j<=cols;j++){let w=10;sh.aoa.forEach(r=>{const v=r[j-1]==null?'':String(r[j-1]);w=Math.max(w,Math.min(46,v.length+4))});ws.getColumn(j).width=w}
    if(cols)ws.autoFilter={from:{row:hIdx,column:1},to:{row:hIdx,column:cols}};
  });
  return new Uint8Array(await wb.xlsx.writeBuffer());
}

      u.name=nn;if(v)u.p=v;save();if(me&&me.u===u.u){sec='users';render()}else users();shut(m);toast(v?'تم الحفظ وتغيير كلمة المرور':'تم حفظ بيانات المستخدم')};
    const d=m.querySelector('#du');if(d)d.onclick=()=>{if(!confirm('حذف المستخدم؟'))return;db.users.splice(i,1);db.regions.forEach(g=>g.emps=g.emps.filter(x=>x!==u.u));save();shut(m,users)};
  };
  const wireU=()=>document.querySelectorAll('[data-u]').forEach(c=>c.onclick=()=>{shut(m);userPanel(+c.dataset.u)});
  draw();
}

  <label>الصلاحيات الإضافية</label><div id="npc">${pc(0,[])}</div><button id="ad" style="margin-top:10px">إضافة</button></div></div>
  <div class="pn"><div class="hd">المستخدمون والصلاحيات</div><div class="bd"><p class="mu" style="margin-top:0">اضغط على أي مستخدم لفتح لوحة صلاحياته.</p><div class="ucs">${db.users.map((u,i)=>`<div class="uc" data-u="${i}"><div class="av">${esc([...u.name.trim()][0]||'?')}</div><div><b>${esc(u.name)}</b><br><small class="mu">@${esc(u.u)}</small><br><span class="tag ${u.role==='manager'?'ok':''}">${u.role==='manager'?'مدير':'موظف'}</span>${u.role==='manager'?'':` <small class="mu">${u.perms.length} صلاحية</small>`}</div></div>`).join('')}</div></div></div>`;
  $('#ad').onclick=()=>{
    const u=$('#nu').value.trim(),p=$('#np').value,n=$('#nn').value.trim();

    if(db.users.some(x=>x.u===u))return alert('اسم المستخدم موجود');
    db.users.push({u,p,name:n,role:$('#nr').value,perms:[...document.querySelectorAll('#npc input:checked')].map(x=>x.dataset.p)});
    save();users();toast('تمت إضافة المستخدم');
  };
  document.querySelectorAll('tr[data-i] [data-p]').forEach(c=>c.onchange=()=>{
    const u=db.users[+c.closest('tr').dataset.i];
    u.perms=[...c.closest('td').querySelectorAll('input:checked')].map(x=>x.dataset.p);save();
  });
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('حذف المستخدم؟')){db.users.splice(+b.dataset.x,1);save();users()}});
}
function dbsec(){
  $('#mn').innerHTML=P('قاعدة البيانات',`<p class="mu" style="margin-top:0" id="syn">...</p>
   <label>عنوان الخادم (API)</label><div class="row"><input id="sv1" value="${esc(SRV)}" placeholder="مثال: http://192.168.8.204:5033/api"><button id="sv2" style="flex:0">حفظ</button><button class="g" id="sv3" style="flex:0">مزامنة الآن</button></div>
   <p class="mu">اتركه فارغاً للعمل محلياً على هذا الجهاز فقط.</p>`)
  +P('نسخة احتياطية',`<div class="row"><button id="bk1">⬇ تحميل نسخة احتياطية (JSON)</button><button class="g" id="bk2">⬆ استعادة من ملف</button><input type="file" id="bk3" accept=".json" style="display:none"></div>
   <p class="mu">النسخة تحتوي كل شيء: المستخدمون والتقارير والحالات والمخالفات والمناطق والشركات والخيارات.</p>`)
  +P('النسخ المحفوظة على الخادم','<div id="bl" class="mu">...</div>');
  dbStamp();
  $('#sv2').onclick=()=>{SRV=$('#sv1').value.trim().replace(/\/$/,'');try{localStorage.setItem('wf_srv',SRV)}catch(e){}
    (async()=>{if(SRV){await pull(true);if(online)await push()}dbsec();toast(SRV?(online?'تم الاتصال بالخادم':'تعذر الاتصال بالخادم'):'تم التحويل للحفظ المحلي',SRV&&!online?1:0)})()};
  $('#sv3').onclick=async()=>{await pull(true);if(online)await push();dbsec();toast(online?'تمت المزامنة':'تعذر الاتصال',online?0:1)};
  $('#bk1').onclick=async()=>{const js=JSON.stringify({app:'pioneers',at:new Date().toISOString(),data:db},null,1);if(NATIVE){try{await nativeSave('backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json',new TextEncoder().encode(js));toast('تم تجهيز النسخة')}catch(e){}return}const b=new Blob([js],{type:'application/json'});
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},2000);toast('تم تحميل النسخة')};
  $('#bk2').onclick=()=>$('#bk3').click();
  $('#bk3').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text()),d=j.data||j;
      if(!d.users||!Array.isArray(d.users))return toast('الملف غير صالح',1);
      if(!confirm('استعادة النسخة؟ ستُستبدل كل البيانات الحالية.'))return;
      applyDB(d);localSave();if(SRV)await push();sec='dbsec';render();toast('تمت الاستعادة')}
    catch(x){toast('تعذر قراءة الملف',1)}};
  (async()=>{const e=$('#bl');if(!SRV)return e.textContent='لا يوجد خادم متصل.';
    try{const r=await fetch(SRV+'/backups',{cache:'no-store'});const L=await r.json();
      e.innerHTML=L.length?`<div class="tool"><span class="mu">${L.length} نسخة</span><span class="sp"></span><button class="g" id="bdk">حذف الكل عدا آخر 20</button><button class="d" id="bda">حذف الكل</button></div><div class="tw2"><table><thead><tr><th>النسخة</th><th>التاريخ</th><th>الحجم</th><th>استعادة</th><th>حذف</th></tr></thead><tbody>`+
        L.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.at)}</td><td>${Math.round(b.size/1024)} KB</td><td><button class="g mini" data-rb="${esc(b.name)}">↩</button></td><td><button class="d mini" data-db="${esc(b.name)}">✕</button></td></tr>`).join('')+`</tbody></table></div>`:'لا توجد نسخ بعد.';
      const wipe=async(payload,msg)=>{try{const q=await fetch(SRV+'/backups/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(q.status===404||q.status===501)return toast('ملف server.js على الخادم قديم — انسخ النسخة الجديدة وأعد تشغيله',1);
        if(!q.ok)throw 0;const j=await q.json();dbsec();toast(msg+' ('+j.deleted+')')}catch(x){toast('تعذر الحذف',1)}};
      const bdk=$('#bdk'),bda=$('#bda');
      if(bdk)bdk.onclick=()=>{if(confirm('حذف كل النسخ عدا آخر 20؟'))wipe({all:true,keep:20},'تم حذف النسخ')};
      if(bda)bda.onclick=()=>{if(confirm('حذف كل النسخ الاحتياطية على الخادم؟ لا يمكن التراجع.'))wipe({all:true,keep:0},'تم حذف كل النسخ')};
      e.querySelectorAll('[data-db]').forEach(b=>b.onclick=()=>{if(confirm('حذف النسخة '+b.dataset.db+'؟'))wipe({name:b.dataset.db},'تم الحذف')});
      e.querySelectorAll('[data-rb]').forEach(b=>b.onclick=async()=>{
        if(!confirm('استعادة النسخة '+b.dataset.rb+'؟ ستُستبدل البيانات الحالية.'))return;
        try{const q=await fetch(SRV+'/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:b.dataset.rb})});
          if(!q.ok)throw 0;await pull(true);sec='dbsec';render();toast('تمت الاستعادة من الخادم')}catch(x){toast('تعذرت الاستعادة',1)}});
    }catch(x){e.textContent='تعذر قراءة النسخ من الخادم.'}})();
}
let pRep='';
function prod(){
  const reps=db.reports,pick=pRep?reps.filter(r=>r.id===pRep):reps;
  const rows=pick.flatMap(r=>r.rows),vio=db.viols.filter(v=>!pRep||v.rep===pRep);
  const tot=rows.length,cl=rows.filter(r=>!!r.s).length,atR=rows.filter(r=>!r.s&&r.reg&&!r.rd).length,fin=rows.filter(r=>r.fin).length;
  const pc=tot?Math.round(cl/tot*100):0;
  const us=[...new Set(rows.map(r=>r.a))].map(u=>{
    const mine=rows.filter(r=>r.a===u),c=mine.filter(r=>r.s).length;
    return {u,name:nm(u),t:mine.length,c,o:mine.filter(r=>!r.s&&!(r.reg&&!r.rd)).length,g:mine.filter(r=>!r.s&&r.reg&&!r.rd).length,
      v:vio.filter(v=>v.by===u).length,f:mine.filter(r=>r.fin).length,p:mine.length?Math.round(c/mine.length*100):0,
      last:mine.filter(r=>r.t).map(r=>r.t).sort().slice(-1)[0]||''};
  }).sort((a,b)=>b.c-a.c);
  const bar=p=>`<div class="bar" style="min-width:90px"><i style="width:${p}%"></i></div>`;
  $('#mn').innerHTML=P('إنتاجية الموظفين',`<div class="tool"><button class="${pRep?'g':''}" data-pr="">كل التقارير</button>${reps.map(r=>`<button class="${pRep===r.id?'':'g'}" data-pr="${r.id}">${esc(r.name)}</button>`).join('')}<span class="sp"></span><button class="g" id="px">Export Excel</button></div>`)
  +`<div class="grid st-g" style="margin-bottom:18px">`+[['إجمالي الحالات',tot],['المغلقة',cl],['المعلقة',tot-cl],['نسبة الإنجاز',pc+'%'],['المخالفات',vio.length]].map(x=>`<div class="st pn" style="padding:14px"><span class="mu">${x[0]}</span><b data-cu="${x[1]}">${x[1]}</b></div>`).join('')+`</div>`
  +P('التفصيل حسب الموظف',`<div class="tw2"><table><thead><tr><th>#</th><th>الموظف</th><th>الإجمالي</th><th>مغلقة</th><th>معلقة</th><th>عند المناطق</th><th>مخالفات حررها</th><th>معتمدة نهائياً</th><th>نسبة الإنجاز</th><th>آخر إنجاز</th></tr></thead><tbody>`
   +(us.map((x,k)=>`<tr><td>${k+1}</td><td><b>${esc(x.name)}</b></td><td>${x.t}</td><td><span class="tag ok">${x.c}</span></td><td>${x.o}</td><td>${x.g}</td><td>${x.v}</td><td>${x.f}</td><td style="min-width:150px">${bar(x.p)}<span class="mu">${x.p}%</span></td><td class="mu">${esc(x.last)}</td></tr>`).join('')||'<tr><td colspan="10" class="mu">لا توجد بيانات</td></tr>')
   +`</tbody><tfoot><tr><th></th><th>المجموع</th><th>${tot}</th><th>${cl}</th><th>${tot-cl-atR}</th><th>${atR}</th><th>${vio.length}</th><th>${fin}</th><th>${pc}%</th><th></th></tr></tfoot></table></div>`)
  +P('مقارنة الإنجاز',hbars(us.map(x=>[x.name+' ('+x.p+'%)',x.c])));
  cu();
  document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{pRep=b.dataset.pr;prod()});
  $('#px').onclick=()=>exp([['الموظف','الإجمالي','مغلقة','معلقة','عند المناطق','مخالفات حررها','معتمدة نهائياً','نسبة الإنجاز','آخر إنجاز'],
    ...us.map(x=>[x.name,x.t,x.c,x.o,x.g,x.v,x.f,x.p+'%',x.last]),
    ['المجموع',tot,cl,tot-cl-atR,atR,vio.length,fin,pc+'%','']],'productivity');
}
function report(){
  const d=db.rows.filter(done).length;
  $('#mn').innerHTML=repPills()+`<div class="pn"><div class="hd">التقرير</div><div class="bd"><div class="grid"><div class="st"><span class="mu">الإجمالي</span><b>${db.rows.length}</b></div><div class="st"><span class="mu">المعبأ</span><b>${d}</b></div><div class="st"><span class="mu">المتبقي</span><b>${db.rows.length-d}</b></div></div>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="fo">المعبأ فقط</label><br><button id="dl">سحب التقرير (Excel)</button> <span id="rm" class="mu"></span></div></div>`;
  wirePills();
  $('#dl').onclick=async()=>{
    const rs=db.rows.filter(r=>!$('#fo').checked||done(r));

    await xl([{name:'التقرير',title:(curRep()?curRep().name:'التقرير'),aoa}],(curRep()?curRep().name:'report')+'.xlsx');
  };
}
